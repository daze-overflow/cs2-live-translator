<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>CS2 字幕设置</title><link rel="stylesheet" href="popup.css"></head>
<body data-state="idle"><main>
  <header><span class="mark" aria-hidden="true">CS2</span><h1>实时中文字幕</h1></header>
  <section class="hero" aria-live="polite">
    <div class="status-line"><span class="dot" aria-hidden="true"></span><div id="state" role="status">正在检查状态…</div><div id="fixture"></div></div>
    <button id="toggle" disabled>开始中文字幕</button>
  </section>
  <section class="settings" aria-labelledby="style-title">
    <div class="section-heading"><h2 id="style-title">字幕样式</h2><button id="reset-style" class="secondary" type="button">恢复默认</button></div>
    <div class="group">
      <div class="control"><label for="showEnglish">显示英文</label><input id="showEnglish" type="checkbox" class="switch"></div>
      <div class="control"><span id="fontSize-label" class="label">字号 (px)</span>
        <div id="fontSize" class="segmented" role="radiogroup" aria-labelledby="fontSize-label">
          <button type="button" data-size="16" role="radio" aria-checked="false">16</button>
          <button type="button" data-size="20" role="radio" aria-checked="false">20</button>
          <button type="button" data-size="24" role="radio" aria-checked="true">24</button>
          <button type="button" data-size="28" role="radio" aria-checked="false">28</button>
        </div>
      </div>
      <div class="control"><label for="bottom">距底部</label><input id="bottom" type="range" min="0" max="60" step="1"><output id="bottom-value" for="bottom"></output></div>
      <div class="control"><label for="backgroundOpacity">背景不透明</label><input id="backgroundOpacity" type="range" min="0" max="100" step="1"><output id="backgroundOpacity-value" for="backgroundOpacity"></output></div>
      <div class="control"><label for="textOpacity">字体不透明</label><input id="textOpacity" type="range" min="0" max="100" step="1"><output id="textOpacity-value" for="textOpacity"></output></div>
    </div>
  </section>
</main><script src="subtitle-style.js"></script><script src="popup.js"></script></body></html>
